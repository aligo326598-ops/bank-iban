<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banka Bilgileri</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Arial,sans-serif;
  background:linear-gradient(145deg,#eef4ff,#f8fbff);
  display:flex; align-items:center; justify-content:center; padding:22px;
  color:#172033;
}
.card{
  width:100%; max-width:430px; background:#fff; border-radius:26px;
  padding:28px; box-shadow:0 18px 50px rgba(30,55,90,.13);
}
.icon{
  width:64px;height:64px;border-radius:18px;background:#eef3ff;
  display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:18px;
}
h1{font-size:26px;margin:0 0 8px}
.subtitle{margin:0 0 25px;color:#697386;font-size:14px}
.info{
  background:#f7f9fc;border:1px solid #e7ebf2;border-radius:17px;
  padding:16px;margin-bottom:12px;
}
.label{font-size:12px;color:#7a8495;margin-bottom:7px}
.value{font-size:16px;font-weight:600;word-break:break-word}
.iban{
  font-family:monospace;font-size:15px;letter-spacing:.3px;
  background:#fff;border:1px solid #e2e7ef;padding:12px;border-radius:12px;
}
button{
  width:100%;border:0;border-radius:15px;padding:15px;margin-top:8px;
  background:#1769ff;color:#fff;font-size:16px;font-weight:700;cursor:pointer;
}
button:active{transform:scale(.99)}
#msg{text-align:center;color:#168447;font-size:13px;font-weight:600;height:20px;margin-top:12px}
.footer{text-align:center;color:#9aa3b2;font-size:11px;margin-top:18px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🏦</div>
  <h1>Banka Bilgileri</h1>
  <p class="subtitle">Ödeme yapmak için aşağıdaki bilgileri kullanabilirsiniz.</p>

  <div class="info">
    <div class="label">Banka</div>
    <div class="value">Ziraat bankası</div>
  </div>

  <div class="info">
    <div class="label">Ad Soyad</div>
    <div class="value" id="isim">İBRAHİM ÖMER ĞAŞİM</div>
  </div>


  <div class="info">
    <div class="label">IBAN</div>
    <div class="iban" id="iban">TR73 0001 0090 1069 7205 0050 01</div>
  </div>

  <button onclick="copyIBAN()">📋 IBAN'ı Kopyala</button>
  <div id="msg1"></div>

  <button onclick="copyName()">📋 İsim'ı Kopyala</button>
  <div id="msg"></div>
  <div class="footer">NFC ile hızlı ve kolay erişim</div>
</div>

<script>
function copyIBAN(){
  const iban=document.getElementById("iban").innerText.replace(/\s/g,'');
  navigator.clipboard.writeText(iban).then(()=>{
    document.getElementById("msg").innerText="IBAN başarıyla kopyalandı ✓";
    setTimeout(()=>document.getElementById("msg").innerText="",2500);
  }).catch(()=>{
    document.getElementById("msg").innerText="IBAN kopyalanamadı.";
  });
}
function copyName(){
  const isim=document.getElementById("isim").innerText;
  navigator.clipboard.writeText(isim).then(()=>{
    document.getElementById("msg").innerText="İsim başarıyla kopyalandı ✓";
    setTimeout(()=>document.getElementById("msg").innerText="",2500);
  }).catch(()=>{
    document.getElementById("msg").innerText="İsim kopyalanamadı.";
  });
}
</script>
</body>
</html>
